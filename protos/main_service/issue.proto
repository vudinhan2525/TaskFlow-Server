syntax = "proto3";

option csharp_namespace = "TaskFlow.IssueService";
option go_package = "github.com/vudinhan2525/TaskFlow-Server/services/go-service/types/main_service;main_service";

package project_service;
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "base.proto";

service IssueService {
  rpc CreateIssue (CreateIssueReq) returns (CreateIssueRes) {
    option (google.api.http) = {
      post: "/api/v1/issues/project/{project_id}"
      body: "*"
    };
  }
  rpc GetIssue (GetIssueReq) returns (base.IssueRes) {
    option (google.api.http) = {
      get: "/api/v1/issues/project/{project_id}/{id}"
    };
  }
  rpc UpdateIssue (UpdateIssueReq) returns (base.IssueRes) {
    option (google.api.http) = {
      put: "/api/v1/issues/project/{project_id}/{id}"
      body: "*"
    };
  }
  rpc DeleteIssue (DeleteIssueReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/issues/project/{project_id}/{id}"
    };
  }
  rpc ListIssues (ListIssuesReq) returns (ListIssuesRes) {
    option (google.api.http) = {
      post: "/api/v1/issues/list-issue"
      body: "*"
    };
  }
  rpc GetActivities (GetActivitiesReq) returns (GetActivitiesRes) {
    option (google.api.http) = {
      post: "/api/v1/issues/list-activities"
      body: "*"
    };
  }
}

message GetActivitiesReq {
  string issue_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetActivitiesRes {
  repeated base.ActivityRes data = 1;
  base.PaginationRes pagination = 2;
}

// Get by ID
message GetIssueReq {
  string id = 1;
  string project_id = 2;
}

// Delete by ID
message DeleteIssueReq {
  string id = 1;
  string project_id = 2;
}

//Update
message UpdateIssueReq {
  string id = 1;
  string project_id = 2;    
  optional string sprint_id = 3;
  optional string assignee_id = 4;
  optional string parent_id = 5;
  optional string reporter_id = 6;
  optional string title = 7;
  optional string summary = 8;
  optional string team_id = 17  ; 
  optional string description = 9;
  optional string type = 10;
  optional string column_id = 11;
  optional string priority = 12;
  optional string due_date_from= 15;
  optional string due_date_to= 16;
  google.protobuf.Int32Value story_point = 13;
  repeated string attachments = 14;
}

// List All
message ListIssuesReq {
  optional string project_id = 1;
  repeated string column_ids = 2;
  repeated string assignee_ids = 3;
  repeated string sprint_ids = 4;
  optional string keyword = 5;
  repeated string issue_ids = 6;
  optional string due_date_from = 7;
  optional string due_date_to = 8;
  optional string created_at_from = 9;
  optional string created_at_to = 10;
  repeated string types = 11;
  repeated string priorities= 12;
  int32 page = 13;
  int32 limit = 14;
  repeated string team_id = 15;
}

message ListIssuesRes {
  repeated base.IssueRes data = 1;
  base.PaginationRes pagination = 2;
}

// Create
message CreateIssueReq {
  string project_id = 1;
  string title = 2;
  optional string sprint_id = 3;
  optional string assignee_id = 4;
  optional string parent_id = 5;
  optional string reporter_id = 6;
  string type = 7;
  string column_id = 8;
  string priority = 9;
  string summary = 10;
  string description = 11;
  optional int32 story_point = 12;
  repeated string attachments = 13;
}

message CreateIssueRes {
  base.IssueRes data = 1;
}

