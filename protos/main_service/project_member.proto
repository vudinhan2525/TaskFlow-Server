syntax = "proto3";

option go_package = "github.com/vudinhan2525/TaskFlow-Server/services/go-service/types/main_service;main_service";
option csharp_namespace = "TaskFlow.ProjectMemberService";

package project_service;

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";
import "base.proto";

service ProjectMemberService {
  rpc AddProjectMember (AddProjectMemberReq) returns (ProjectMemberRes) {
    option (google.api.http) = {
      post: "/api/v1/projects/{project_id}/members"
      body: "*"
    };
  }
  rpc RemoveProjectMember (RemoveProjectMemberReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/projects/{project_id}/members/{user_id}"
    };
  }
  rpc UpdateProjectMemberRole (UpdateProjectMemberRoleReq) returns (ProjectMemberRes) {
    option (google.api.http) = {
      put: "/api/v1/projects/{project_id}/members/{user_id}/role"
      body: "*"
    };
  }
  rpc ListProjectMembers (ListProjectMembersReq) returns (ListProjectMembersRes) {
    option (google.api.http) = {
      get: "/api/v1/projects/{project_id}/members"
    };
  }
  rpc GetUserMemberships (UserMembershipsReq) returns (GetUserMembershipsRes) {
    option (google.api.http) = {
      get: "/api/v1/users/{user_id}/memberships"
    };
  }
  rpc ApproveMember (ApproveMemberReq) returns (ProjectMemberRes) {
    option (google.api.http) = {
      put: "/api/v1/projects/{project_id}/members/{user_id}/approve"
      body: "*"
    };
  }
  rpc RejectMember (RejectMemberReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/projects/{project_id}/members/{user_id}/reject"
      body: "*"
    };
  }
  rpc AcceptInvitation (AcceptInvitationReq) returns (ProjectMemberRes) {
    option (google.api.http) = {
      put: "/api/v1/projects/{project_id}/invitations/accept"
      body: "*"
    };
  }
  rpc RejectInvitation (RejectInvitationReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/projects/{project_id}/invitations/reject"
      body: "*"
    };
  }
}

enum ProjectMemberRole {
  MEMBER = 0;
  ADMIN = 1;
  OWNER = 2;
  VIEWER = 3;
}

message AddProjectMemberReq {
  string project_id = 1;
  string user_id = 2;
  ProjectMemberRole role = 3;
}

message RemoveProjectMemberReq {
  string project_id = 1;
  string user_id = 2;
}

message UpdateProjectMemberRoleReq {
  string project_id = 1;
  string user_id = 2;
  ProjectMemberRole role = 3;
}

message ListProjectMembersReq {
  string project_id = 1;
  optional string name = 2;
  optional string email = 3;
  int32 page = 4;
  int32 limit = 5;
}

message ProjectMemberRes {
  string id = 1;
  string project_id = 2;
  string user_id = 3;
  ProjectMemberRole role = 4;
  bool is_pending = 5;
  string created_at = 6;
  string updated_at = 7;
  UserInfo user = 8;
}

message UserInfo {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
}

message ProjectInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
  string created_at = 5;
  string updated_at = 6;
}

message UserMembershipRes {
  string id = 1;
  string project_id = 2;
  string user_id = 3;
  ProjectMemberRole role = 4;
  bool is_pending = 5;
  string created_at = 6;
  string updated_at = 7;
  ProjectInfo project = 8;
}

message ListProjectMembersRes {
  repeated ProjectMemberRes data = 1;
  base.PaginationRes pagination = 2;
}

message UserMembershipsReq {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetUserMembershipsRes {
  repeated UserMembershipRes data = 1;
  base.PaginationRes pagination = 2;
}

message ApproveMemberReq {
  string project_id = 1;
  string user_id = 2;
}

message RejectMemberReq {
  string project_id = 1;
  string user_id = 2;
}

message AcceptInvitationReq {
  string project_id = 1;
}

message RejectInvitationReq {
  string project_id = 1;
}